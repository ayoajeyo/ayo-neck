# 푸시할 때마다 안드로이드 테스트용 APK를 클라우드에서 빌드
# (PC에 자바·안드로이드 SDK가 없어도 됨. APK는 Actions 탭 > 해당 실행 > Artifacts에서 다운로드)
name: Android APK

on:
  push:
    branches: [main]
    paths: [www/**, android/**, capacitor.config.json, .github/workflows/build-android.yml]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ayo-neck-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
